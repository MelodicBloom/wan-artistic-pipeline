name: Pipeline CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-json:
    name: Validate JSON assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all workflow and TTM path JSON
        run: |
          python - <<'PY'
          import json, glob, sys
          failed = []
          for f in glob.glob("workflows/*.json") + glob.glob("ttm_paths/*.json"):
              try:
                  json.load(open(f))
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f} — {e}")
                  failed.append(f)
          if failed:
              sys.exit(1)
          PY

  validate-config:
    name: Validate pipeline config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check required config keys
        run: |
          python - <<'PY'
          import yaml, sys
          cfg = yaml.safe_load(open("config/pipeline.yaml"))
          required = [
              ("controlnet", "ttm_path_folder"),
              ("controlnet", "default_ttm_path"),
              ("controlnet", "sparse_keyframe_strengths"),
              ("pipeline", "enable_sparse_keyframes"),
              ("pipeline", "multi_keyframe_count"),
          ]
          failed = []
          for section, key in required:
              if key not in cfg.get(section, {}):
                  print(f"MISSING: {section}.{key}")
                  failed.append(key)
              else:
                  print(f"OK: {section}.{key}")
          if failed:
              sys.exit(1)
          PY

  dry-run:
    name: Dry run (import + prompt generation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pyyaml python-dotenv requests watchdog tqdm pillow transformers torch --index-url https://download.pytorch.org/whl/cpu

      - name: Dry run with sparse keyframes
        run: |
          python generate.py --dry-run --sparse-keyframes --image input/IMG_4738.jpg || true
