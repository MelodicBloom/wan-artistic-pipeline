name: Pipeline CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-json:
    name: Validate JSON assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all workflow and TTM path JSON
        run: |
          python - <<'PY'
          import json, glob, sys
          failed = []
          for f in glob.glob("workflows/*.json") + glob.glob("ttm_paths/*.json"):
              try:
                  json.load(open(f))
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f} — {e}")
                  failed.append(f)
          if failed:
              sys.exit(1)
          PY

  validate-config:
    name: Validate pipeline config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check required config keys
        run: |
          python - <<'PY'
          import yaml, sys
          cfg = yaml.safe_load(open("config/pipeline.yaml"))
          required = [
              ("controlnet", "ttm_path_folder"),
              ("controlnet", "default_ttm_path"),
              ("controlnet", "sparse_keyframe_strengths"),
              ("pipeline", "enable_sparse_keyframes"),
              ("pipeline", "multi_keyframe_count"),
          ]
          failed = []
          for section, key in required:
              if key not in cfg.get(section, {}):
                  print(f"MISSING: {section}.{key}")
                  failed.append(key)
              else:
                  print(f"OK: {section}.{key}")
          if failed:
              sys.exit(1)
          PY

  dry-run:
    name: Dry run (prompt + sparse-keyframe metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate deterministic prompt metadata without GPU/runtime dependencies
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          from src.prompt_engine import load_pack, generate_job_prompts

          random.seed(314159)
          pack = load_pack(Path("prompt-packs/surreal-ethereal-dancer.json"))
          control = {
              "multi_keyframe_count": 4,
              "sparse_strengths": {"start": 0.90, "middle": 0.65, "end": 0.90},
              "ttm_path": "ttm_paths/gentle_orbit.json",
          }
          jobs = generate_job_prompts(
              pack,
              ["calibration-subject", "stable-composition", "material-detail", "controlled-motion"],
              variations_per_hybrid=1,
              control_payload=control,
              duration_seconds=6,
              fps=24,
          )
          assert jobs, "prompt engine produced no jobs"
          assert all(len(job["metadata"]["keyframes"]) == 4 for job in jobs)
          assert all(job["metadata"]["ttm_path"] == "ttm_paths/gentle_orbit.json" for job in jobs)
          print(f"OK: generated {len(jobs)} deterministic smoke-test jobs")
          PY
